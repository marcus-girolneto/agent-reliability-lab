[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Reproducible incident-response evaluations for tool-using agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Marcus Vinicius Girolneto Sousa"}]
dependencies = ["openai>=2.0,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
agent-lab = "agent_reliability_lab.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
